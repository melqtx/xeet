version: 2

project_name: xeet

before:
  hooks:
    - go mod download

builds:
  - id: xeet
    main: .
    binary: xeet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildTime={{ .Date }}

archives:
  - id: archives
    ids:
      - xeet
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# Let GitHub write the notes from merged PR titles and authors. The previous
# hand-rolled changelog sorted by commit *message*, so v0.1.9 shipped an
# alphabetised wall of full SHAs. sort/filters/groups do not apply here.
changelog:
  use: github-native

release:
  draft: false
  prerelease: auto
  mode: replace
