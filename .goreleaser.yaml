version: 2

project_name: xeet

before:
  hooks:
    - go mod download

builds:
  - id: xeet
    main: .
    binary: xeet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.buildTime={{ .Date }}

archives:
  - id: archives
    builds:
      - xeet
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge '
      - '^docs:'
      - '^test:'

release:
  draft: false
  prerelease: auto
  mode: replace
